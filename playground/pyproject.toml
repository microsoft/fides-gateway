[project]
name = "fides-gateway-playground"
version = "0.1.0"
description = "Textual TUI playground for editing and evaluating Regorus policies against fides-gateway LabeledToolCallParams"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.85",
    # The playground reuses ``policy_engine.eval_policy`` from the
    # parent fides-gateway project; pull it in as an editable path
    # dependency so changes upstream are picked up live.
    "fides-gateway",
]

[tool.uv.sources]
fides-gateway = { path = "..", editable = true }

[project.scripts]
fides-playground = "playground:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

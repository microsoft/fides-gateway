name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        # ``regorus`` (used by the ``eval_policy`` tool) is not on PyPI and
        # is built from source via maturin, which requires a Rust compiler.
        # Mirrors the rustup invocation documented in the README under
        # "Installing regorus locally".
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Check formatting with black
        run: |
          black --check .

      - name: Run pytest with coverage
        run: |
          pytest -v --cov=gateway --cov-branch --cov-report=term-missing --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

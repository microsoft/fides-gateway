[project]
name = "fides-gateway"
version = "0.1.0"
description = "MCP gateway for propagating information-flow control labels and deterministically enforcing policies in agents"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0",
    "jsonpath-rfc9535>=1.0",
    "jsonschema>=4.26.0",
    "msal>=1.36.0",
    "mcp>=1.27.0",
    # ``regorus`` powers the gateway's ``eval_policy`` tool. It is not yet
    # published to PyPI (see https://github.com/microsoft/regorus), so it is
    # installed from the upstream git repo. Building it from source requires
    # a Rust toolchain — CI sets one up before ``pip install``.
    "regorus @ git+https://github.com/microsoft/regorus.git@regorus-v0.10.1#subdirectory=bindings/python",
]
scripts.fides-gateway = "gateway:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "anyio>=4.12.0", "black>=26.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py312"]

[tool.hatch.metadata]
# Required because ``regorus`` in ``[project.dependencies]`` is a direct
# reference to a git URL (it is not yet published to PyPI).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
